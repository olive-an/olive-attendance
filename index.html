<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#126a56"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="おりーぶ庵 勤怠"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><title>おりーぶ庵 打刻管理</title><link rel="stylesheet" href="./style.css"></head><body>
<main class="app">
<small>おりーぶ庵株式会社　｜　打刻管理 Ver.2</small>

<section id="login" class="hidden">
<h1>ログイン</h1>
<label for="empId">従業員番号</label><input id="empId" inputmode="numeric" autocomplete="username">
<label for="pin">PIN(数字6桁)</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
<button class="button" id="loginBtn">ログイン</button>
<p class="notice" id="loginMsg" role="alert"></p>
<p class="muted">従業員番号とPINは管理者(岩久保)からお渡しします。</p>
</section>

<section id="main" class="hidden">
<div class="top"><h1 id="who"></h1><button class="secondary small" id="menuBtn">設定</button></div>
<div class="tabs hidden" id="tabs"><button id="tabPunch" class="on">打刻</button><button id="tabAdmin">管理</button></div>

<div id="punchView">
<div id="clock"></div>
<div class="status" id="state">…</div>
<div id="inForm">
<label>勤務区分</label><div class="seg" id="shiftSeg"></div>
<label for="site">勤務先</label><select id="site"></select>
</div>
<button class="button" id="inBtn">出勤する</button>
<button class="button out" id="outBtn">退勤する</button>
<p class="notice" id="msg" role="status"></p>
<div class="row"><h2 style="margin:0">打刻履歴</h2><div><button class="secondary small" id="prev">◀</button> <b id="monthLabel"></b> <button class="secondary small" id="next">▶</button></div></div>
<div id="history"></div>
<button class="secondary" id="addReq" style="margin-top:12px;width:100%">打刻漏れ・修正を申請する</button>
<h2>申請状況</h2><div id="myReqs"></div>
</div>

<div id="adminView" class="hidden">
<h2>承認待ち</h2><div id="pending"></div>
<div class="row"><h2 style="margin:0">月次一覧</h2><div><button class="secondary small" id="aprev">◀</button> <b id="amonthLabel"></b> <button class="secondary small" id="anext">▶</button></div></div>
<div id="summary"></div>
<button class="secondary" id="csv" style="margin-top:10px;width:100%">この月をCSVで保存</button>
<h2>PINの再発行</h2>
<select id="resetSel"></select><button class="secondary" id="resetBtn" style="margin-top:8px;width:100%">選んだ人のPINを再発行</button>
<p class="notice" id="amsg" role="status"></p>
</div>
</section>

<p class="warning" id="config-warn" hidden>config.js に Apps Script のURLが設定されていません。</p>
</main>

<dialog id="reqDlg"><form method="dialog" id="reqForm">
<h2 style="margin-top:0">修正の申請</h2>
<p class="muted" id="reqTarget"></p>
<label>勤務区分</label><select id="rqShift"></select>
<label for="rqIn">正しい出勤日時</label><input id="rqIn" type="datetime-local" required>
<label for="rqOut">正しい退勤日時</label><input id="rqOut" type="datetime-local" required>
<label for="rqReason">理由(必須)</label><textarea id="rqReason" maxlength="200" required></textarea>
<p class="notice err" id="rqMsg"></p>
<div class="actions"><button type="button" class="secondary" id="rqCancel">閉じる</button><button type="submit" class="button" style="margin:0;padding:12px;font-size:17px">申請する</button></div>
</form></dialog>

<dialog id="decDlg"><form method="dialog" id="decForm">
<h2 style="margin-top:0">申請の判断</h2><div id="decBody" class="history" style="border:0"></div>
<label for="decComment">コメント(却下は必須)</label><textarea id="decComment" maxlength="200"></textarea>
<p class="notice err" id="decMsg"></p>
<div class="actions"><button type="button" class="secondary" id="decCancel">閉じる</button><button type="button" class="secondary danger" id="decNg">却下</button><button type="button" class="button" id="decOk" style="margin:0;padding:12px;font-size:17px">承認</button></div>
</form></dialog>

<dialog id="menuDlg"><h2 style="margin-top:0">設定</h2>
<label for="oldPin">現在のPIN</label><input id="oldPin" type="password" inputmode="numeric" maxlength="6">
<label for="newPin">新しいPIN(数字6桁)</label><input id="newPin" type="password" inputmode="numeric" maxlength="6">
<p class="notice" id="pinMsg"></p>
<div class="actions"><button class="secondary" id="menuClose">閉じる</button><button class="secondary" id="pinBtn">PINを変更</button><button class="secondary danger" id="logout">ログアウト</button></div>
</dialog>
<script src="./config.js"></script><script src="./app.js"></script></body></html>

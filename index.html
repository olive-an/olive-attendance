<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#126a56"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="おりーぶ庵 勤怠"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><title>岩久保専用｜おりーぶ庵勤怠</title><style>body{margin:0;background:#edf3f0;color:#18362d;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;background:#fff;padding:24px;box-sizing:border-box}small{color:#64786e}h1{font-size:24px;margin:8px 0 25px}.panel{background:#eff6f2;border-radius:18px;padding:18px;margin:16px 0}.row{display:flex;justify-content:space-between;margin:12px 0;gap:10px}.status{font-size:24px;font-weight:750;text-align:center;padding:20px}.button{border:0;width:100%;padding:22px;border-radius:16px;color:#fff;font-size:23px;font-weight:700;margin:8px 0;background:#14815c}.button.out{background:#315f91}.button:disabled{background:#a9b7b0}.history{border-bottom:1px solid #ddd;padding:13px 0;line-height:1.8}.muted{color:#6d7d75;font-size:13px}.warning{padding:12px;background:#fff5dc;border-radius:12px;font-size:13px}button.secondary{background:#f2f4f2;color:#24463a;border:1px solid #ccd7d0;padding:12px;border-radius:12px}#clock{font-size:20px;text-align:center;font-variant-numeric:tabular-nums}</style></head><body><main class="app"><small>おりーぶ庵株式会社　｜　個人用試作アプリ</small><h1>岩久保 博一　勤怠打刻</h1><div class="panel"><div class="row"><span>勤務先</span><b>本社事務所</b></div><div class="row"><span>基本勤務</span><b>9:00〜18:00</b></div><div class="row"><span>休憩</span><b>60分（自動控除）</b></div></div><div id="clock"></div><div class="status" id="status">勤務前</div><button class="button" id="in">出勤する</button><button class="button out" id="out">退勤する</button><p id="notice" aria-live="polite"></p><h2>打刻履歴</h2><div id="history"></div><div class="panel"><b>データ出力（試作）</b><p class="muted">この端末の打刻記録をCSVで保存できます。</p><button class="secondary" id="export">CSVを保存</button></div><p class="warning">試作版です。打刻データはこの端末のブラウザ内だけに保存され、他の端末・管理者とは同期しません。ブラウザのデータ削除で消える場合があります。正式な勤怠管理には使用しないでください。</p></main><script>const key='olive_iwakubo_demo_v1';let data=[];try{data=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}const $=id=>document.getElementById(id),dt=()=>{let d=new Date();return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)};function render(){const last=data.at(-1),active=last&&!last.out;$('status').textContent=active?'勤務中':last?.out?'退勤済':'勤務前';$('in').disabled=!!active;$('out').disabled=!active;$('history').replaceChildren();for(const r of [...data].reverse()){let div=document.createElement('div');div.className='history';let text='出勤：'+r.in+'\n退勤：'+(r.out||'未打刻');if(r.out){let minutes=Math.max(0,Math.round((new Date(r.outISO)-new Date(r.inISO))/60000)-60);text+='\n休憩：60分｜実労働（試算）：'+Math.floor(minutes/60)+'時間'+minutes%60+'分'}div.style.whiteSpace='pre-line';div.textContent=text;$('history').append(div)}if(!data.length)$('history').textContent='まだ記録はありません'}function save(){localStorage.setItem(key,JSON.stringify(data));render()}$('in').onclick=()=>{if(data.at(-1)&&!data.at(-1).out)return;const d=new Date();if(!confirm('出勤を記録しますか？'))return;data.push({in:dt(),inISO:d.toISOString(),out:null,outISO:null});save();$('notice').textContent='出勤を記録しました'};$('out').onclick=()=>{if(!data.at(-1)||data.at(-1).out)return;if(!confirm('退勤を記録しますか？'))return;const d=new Date();data.at(-1).out=dt();data.at(-1).outISO=d.toISOString();save();$('notice').textContent='退勤を記録しました'};$('export').onclick=()=>{const rows=[['氏名','出勤','退勤','休憩分','実労働分'],...data.map(r=>['岩久保 博一',r.in,r.out||'',60,r.out?Math.max(0,Math.round((new Date(r.outISO)-new Date(r.inISO))/60000)-60):''])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='岩久保_勤怠デモ.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};setInterval(()=>$('clock').textContent=dt(),1000);$('clock').textContent=dt();render();if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
